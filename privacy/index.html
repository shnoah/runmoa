  <script>
    (function () {
      var saved = localStorage.getItem('runmoa-language');
      var languages = saved ? [saved] : (navigator.languages || [navigator.language || 'en']);
      var selected = 'en';
      for (var i = 0; i < languages.length; i += 1) {
        var code = String(languages[i]).toLowerCase().split(/[-_]/)[0];
        if (code === 'ko' || code === 'en') { selected = code; break; }
      }
      location.replace('../' + selected + '/privacy/');
    }());
  </script>
